# pats.yaml is a mapping of vectors. the key is the vector's name. a vector has a `kind` (sandbox | harness | agent | task | scorer | suite),
# optional `defaults`, and `items` keyed by name. an item inherits every default it doesn't set, and `field: ~` unsets one.
# names are unique per kind, and follow chisel's package-name rule (lowercase, digits, dots, pluses, single hyphens).
# a reference (a suite axis, `sandbox:`, `-a` / `-t` / `-s`) takes a vector name or an item name.
# nothing in pats.yaml is templated: a step is a shell script, and reads the names it runs for from its env
# ($PATS_TASK_NAME, $PATS_TASK_VECTOR, $PATS_SCORER_NAME, ...). the readme has the full rules.

sandbox:
  kind: sandbox
  items:
    docker:
      # with neither `image:` nor `build:`, the published pats sandbox pinned to this pats version (ghcr.io/lczyk/pats/sandbox:v<version>).
      # `build: <dir or Dockerfile>` builds a context at run start, with that image passed in as the PATS_SANDBOX build arg.
      # egress is the outbound network policy. absent: open, unfiltered (the host and its lan too). `egress: none`:
      # no network. a mapping: a filtering proxy the sandbox can only reach the net through; `{default: allow}` passes
      # every host but private, link-local (metadata), multicast and cgnat addresses (a global-numbered lan still passes). deny always wins, then allow, then `default` (deny).
      # egress:
      #   allow:
      #     - .ubuntu.com                        # apt mirrors (a dot prefix covers subdomains)
      #     - github.com                         # a host, on 80 and 443; `github.com:22` for one port
      #     - '.githubusercontent.com/canonical/**'  # a url entry: its host is mitm'd, only matching paths pass
      #   deny:
      #     - 'github.com/*/some-answer-repo**'  # the answer source, by url (`*` stays in one path segment, `**` crosses `/`)
      #   # default: allow          # a denylist instead; bare hosts in allow are dead under it
      #   # deny-response: 404      # 403 (default) | 404 | reset | timeout
      #   # allow-private: true     # let entries name lan / loopback targets
      #   # methods: [GET, HEAD]    # refuse writes everywhere; every allowed host but the harness's gets mitm'd
      # host lists other tasks tend to need, to copy from:
      #   pypi:   pypi.org, files.pythonhosted.org
      #   npm:    registry.npmjs.org
      #   crates: crates.io, static.crates.io, index.crates.io
      #   go:     proxy.golang.org, sum.golang.org, storage.googleapis.com
      # `base:` + `provision:` make the image instead (any driver): the script runs once per image, as root, with bin/ on PATH.
      # `limits: {cpu: 4, memory: 8GiB}` caps resources; `max-parallel: 2` caps this sandbox's concurrent pairs.
    # an lxd sandbox: a system container (or `vm: true`) on the server an lxc remote names. with no `base` it is
    # provisioned with the pats sandbox's tools; `sudo: true` lets the agent sudo, `config:` and `profiles:` pass through.
    # lxd:
    #   driver: lxd
    #   remote: my-server
    #   provision: |
    #     apt-get update && apt-get -y install dpkg-dev

# a harness is how an agent is run. pats ships five (`pats config --defaults` prints them, the readme has their creds and
# model ids), a machine can add its own (`~/.config/pats/config.yaml`), and a `kind: harness` vector here adds or changes
# them for this project. an item named as a harness that exists changes the keys it sets and keeps the rest (`field: ~`
# unsets one). an item with a new name is a harness of its own: it needs a `run`, a shell script run in the sandbox
# with $PATS_MODEL, $PATS_PROMPT_FILE, $PATS_OUTPUT_DIR and $PATS_EFFORT, and whatever it runs comes from the sandbox's
# `provision`. `egress` is the hosts it needs itself, `auth-env` and `pass-env` the host variables it is handed, `parse`
# a script that reads its output for cost and tool counts (docs/spec/harness-parse.md).
harnesses:
  kind: harness
  items:
    # the floor of every scorer: an agent that does nothing. its run reads no model, so its agents need none.
    noop:
      run: "true"
    # hermes, installed by a sandbox's provision. the flags are its own: check them against the release you install.
    # with no `parse` there is no cost and no tool count, and as a judge its whole stdout is its reply.
    hermes-openrouter:
      run: hermes chat --query-file "$PATS_PROMPT_FILE" --oneshot -Q --yolo --model "$PATS_MODEL"
      egress:
        allow: [openrouter.ai]
      auth-env: [OPENROUTER_API_KEY]
    # a default at another setting: every claude-cli-keyless agent here may also reach a mirror of its api.
    # claude-cli-keyless:
    #   egress:
    #     allow: [.anthropic.com, .claude.com, claude.mirror.example]
    # a default at another version of its cli, for the sandboxes its agents run in. `pats harness pin opencode 1.19.4`
    # prints the two keys; they come together, and a sandbox holds one version of a cli.
    # opencode-openrouter:
    #   version: 1.19.4
    #   hash:
    #     amd64: sha256:dca7b06bbb4e4a1ab3681b799cd328057b356d9399e8e47336cf53b7ae658d0d
    #     arm64: sha256:019c374e3eb3af5d2c2cdf1d2d6e1f9eee0bc9f3289e02570e4310d25df0a991

# harness: one of the five, a machine's, or an item above. with one sandbox defined every agent uses it, otherwise set
# `sandbox:`. `effort:` is optional reasoning effort. `model:` is required unless the harness's `run` reads none.
haiku:
  kind: agent
  items:
    # the same model under two harnesses isolates the harness's effect from the model's.
    haiku-claude-cli:
      harness: claude-cli-keyless
      model: claude-haiku-4-5-20251001
    haiku-opencode:
      harness: opencode-openrouter
      model: anthropic/claude-haiku-4.5

# a judge for agent scorers: an agent in no suite, named by a scorer's `agent`. pats judge runs it.
judge:
  kind: agent
  items:
    judge:
      harness: claude-cli-keyless
      model: claude-sonnet-4-6

# the prompt is `prompt` (literal text), `prompt-file` or `prompt-cmd` (a script; its stdout). `stage` and `collect` are
# shell scripts, a one-liner like `./collect.sh --fast` included, run on the host with PATS_* env set and this dir's bin/
# on PATH: stage before the sandbox starts, collect after the agent. `prepare` runs inside the sandbox as root, after
# stage and before the agent, with bin/ (and nothing else from the host) on its PATH. `env:` adds variables for the
# task's scripts. timeout is per pair, 10m by default, and covers the agent only.
# a task vector can instead take `dir: <path>`: every directory under it holding a task.yaml is one task, configured by that
# file alone, with its scripts run and its paths resolved in its own directory.
# `step-sandbox: <sandbox>` runs stage, prompt-cmd and collect in that sandbox instead of on the host, at their host
# paths, with the tree read-only; `step-env: [NAME]` passes host variables in. unset: on the host.
write-readme:
  kind: task
  defaults:
    prompt-cmd: cat "prompts/$PATS_TASK_VECTOR-$PATS_TASK_NAME.txt"
    stage: scripts/stage.sh --"$PATS_TASK_NAME"
    collect: scripts/collect.sh --"$PATS_TASK_NAME"
  items:
    simple:
    hard:
    monorepo:
      # a task can add to its sandbox's egress lists (not its posture), when the sandbox runs the proxy:
      # egress:
      #   allow: [registry.npmjs.org]          # a host this task alone needs
      #   deny: ['github.com/*/monorepo-answers**']

# a scorer's `score` is a script: it reads a pair's collected output and prints a float in [0,1], or `na`, on its first stdout line.
# `step-sandbox:` runs it in a sandbox, as for a task, with the run dir read-only.
style:
  kind: scorer
  defaults:
    score: scorers/"$PATS_SCORER_NAME".sh
  items:
    only-ascii:
    title-correct:
    no-finite-verbs:
    # an agent scorer: its agent judges a copy of the pair's output, with a task's steps to shape what it sees.
    no-colloquialisms:
      score: ~                                  # unset the vector's default: an agent scorer has no score
      agent: judge
      prompt-file: prompts/no-colloquialisms.txt
      # stage: rm -f "$PATS_WORKDIR"/answer-key.md   # take out what the judge must not see
      # timeout: 5m

# a suite runs its agents x tasks and scores its tasks x scorers. every item must be in at least one suite.
suites:
  kind: suite
  items:
    readme:
      agents: haiku
      tasks: write-readme
      scorers: style
    # a manual suite stays out of a bare `pats run`; `pats run -S <name>` runs it.
    # readme-sweep:
    #   manual: true
    #   agents: [haiku, judge]
    #   tasks: write-readme
    #   scorers: style
