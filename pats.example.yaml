# pats.yaml is a mapping of vectors. the key is the vector's id. a vector has a `kind` (sandbox | agent | task | scorer | suite),
# optional `defaults`, and `items` keyed by id. an item inherits every default it doesn't set, and `field: ~` unsets one.
# ids are unique per kind. a reference (a suite axis, `sandbox:`, `-a` / `-t` / `-s`) takes a vector id or an item id.
# in defaults and items, `${task}` / `${agent}` / `${scorer}` / `${sandbox}` expand to the item's id and `${vector}` to its vector's,
# except inside inline content (a prompt, a script body, env). the readme has the full rules.

sandbox:
  kind: sandbox
  items:
    docker:
      # with neither `image:` nor `build:`, the published pats sandbox pinned to this pats version (ghcr.io/lczyk/pats/sandbox:v<version>).
      # `build: <dir or Dockerfile>` builds a context at run start, with that image passed in as the PATS_SANDBOX build arg.
      # egress is the outbound network policy. absent: open. `egress: none`: no network. a mapping: a filtering
      # proxy the sandbox can only reach the net through. deny always wins, then allow, then `default` (deny).
      # egress:
      #   allow:
      #     - .ubuntu.com                        # apt mirrors (a dot prefix covers subdomains)
      #     - github.com                         # a host, on 80 and 443; `github.com:22` for one port
      #     - '.githubusercontent.com/canonical/*'   # a url entry: its host is mitm'd, only matching paths pass
      #   deny:
      #     - 'github.com/*/some-answer-repo*'   # the answer source, by url (`*` matches anything, `/` included)
      #   # default: allow          # a denylist instead; bare hosts in allow are dead under it
      #   # deny-response: 404      # 403 (default) | 404 | reset | timeout
      #   # allow-private: true     # let entries name lan / loopback targets
      #   # methods: [GET, HEAD]    # refuse writes everywhere; every allowed host but the harness's gets mitm'd
      # host lists other tasks tend to need, to copy from:
      #   pypi:   pypi.org, files.pythonhosted.org
      #   npm:    registry.npmjs.org
      #   crates: crates.io, static.crates.io, index.crates.io
      #   go:     proxy.golang.org, sum.golang.org, storage.googleapis.com

# harness: claude-cli-keyless | codex-cli-keyless | copilot-cli-keyless | opencode-openrouter (creds and model ids per harness: see the readme).
# with one sandbox defined every agent uses it, otherwise set `sandbox:`. `effort:` is optional reasoning effort.
haiku:
  kind: agent
  items:
    # the same model under two harnesses isolates the harness's effect from the model's.
    haiku-claude-cli:
      harness: claude-cli-keyless
      model: claude-haiku-4-5-20251001
    haiku-opencode:
      harness: opencode-openrouter
      model: anthropic/claude-haiku-4.5

# a judge for agent scorers (not implemented yet): an agent in no suite, named by a scorer's `agent`.
# judge:
#   kind: agent
#   items:
#     judge:
#       harness: claude-cli-keyless
#       model: claude-sonnet-4-6

# the prompt is `prompt` (literal text), `prompt-file` or `prompt-cmd` (its stdout). prepare and collect are an inline script
# (`prepare`, `collect`) or a command line (`prepare-cmd`, `collect-cmd`), run on the host with PATS_* env set and this dir's
# bin/ on PATH. `env:` adds variables for the task's scripts. timeout is per pair, 10m by default.
# a task vector can instead take `dir: <path>`: every directory under it holding a task.yaml is one task, configured by that
# file alone, with its scripts run and its paths resolved in its own directory.
write-readme:
  kind: task
  defaults:
    prompt-file: prompts/${vector}-${task}.txt
    prepare-cmd: scripts/prepare.sh --${task}
    collect-cmd: scripts/collect.sh --${task}
  items:
    simple:
    hard:
    monorepo:
      # a task can add to its sandbox's egress lists (not its posture), when the sandbox runs the proxy:
      # egress:
      #   allow: [registry.npmjs.org]          # a host this task alone needs
      #   deny: ['github.com/*/monorepo-answers*']

# a scorer (`score` inline, or `score-cmd`) reads a pair's collected output and prints a float in [0,1], or `na`, on its first stdout line.
style:
  kind: scorer
  defaults:
    score-cmd: scorers/${scorer}.sh
  items:
    only-ascii:
    title-correct:
    no-finite-verbs:
    # an agent scorer (not implemented yet):
    # no-colloquialisms:
    #   agent: judge
    #   prompt-file: prompts/no-colloquialisms.txt

# a suite runs its agents x tasks and scores its tasks x scorers. every item must be in at least one suite.
suites:
  kind: suite
  items:
    readme:
      agents: haiku
      tasks: write-readme
      scorers: style
