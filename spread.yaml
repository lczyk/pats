# system tests, run by `make spread`. two backends:
#   bread: pats built from this tree in a bread container
#          (github.com/lczyk/spread-bread) on the host's docker. cheap.
#   lxd:   an ubuntu system container on the local lxd, with systemd and
#          snapd, for the snap and the engines it drives nested inside.
# hack/spread/ is how each makes and removes a system.
project: pats

path: /pats

exclude:
  - .git
  - .github
  - .spread
  - .spread-reuse.yaml
  - .pats
  - .stamp
  - .cache
  - docs/spec/fizz/out

repack: source hack/spread/repack.sh

backends:
  bread:
    type: adhoc
    allocate: source hack/spread/bread_allocate.sh
    discard: source hack/spread/bread_discard.sh
    systems:
      - ubuntu-24.04-amd64:
          password: bread
      - ubuntu-24.04-arm64:
          password: bread
      - ubuntu-26.04-amd64:
          password: bread
      - ubuntu-26.04-arm64:
          password: bread
  # the host's arch only.
  lxd:
    type: adhoc
    allocate: source hack/spread/lxd_allocate.sh
    discard: source hack/spread/lxd_discard.sh
    systems:
      - ubuntu-22.04:
          password: pats-spread
      - ubuntu-24.04:
          password: pats-spread
          workers: 2
      - ubuntu-26.04:
          password: pats-spread
          workers: 2

kill-timeout: 20m

suites:
  tests/spread/bread/:
    summary: pats from this tree on docker
    backends: [bread]
    environment:
      # the host dir bound at the same path in the system (bread_allocate.sh): pats's
      # state and projects live there, so the host daemon can bind them.
      SHARED: $(cat /etc/pats-spread-dir)
      HOME: $SHARED/home
      PATS: /usr/local/bin/pats
    prepare: |
      # bread is ubuntu and sshd: the pair's fixture is a git repo, and pats
      # fetches harness clis over https.
      apt-get update -q
      apt-get install -y -q --no-install-recommends git ca-certificates
      mkdir -p "$HOME"
      docker version
      pats --version

  tests/spread/snap/:
    summary: the snap, and the engines it drives, nested in an lxd container
    backends: [lxd]
    environment:
      PATS: /snap/bin/pats
      SNAP_DIR: /snap/pats/current
      PATH: $PATH:$SPREAD_PATH/tests/spread/lib
    prepare: |
      apt-get update -q
      apt-get install -y -q --no-install-recommends git binutils > /dev/null
      useradd --create-home --shell /bin/bash tester
      snap install --dangerous /var/tmp/pats.snap
      # stamped as root and as the tester.
      install -m 0666 /dev/null /var/tmp/spread-stamps
    prepare-each: |
      stamp "== $SPREAD_JOB"
    restore-each: |
      stamp "reset"
      reset-system
