# what this pats knows about the harnesses it ships: docs/spec/machine-config.md.

clis:
  claude:
    version: 2.1.319
    login-file: .claude/.credentials.json

  codex:
    version: 0.167.0
    login-file: .codex/auth.json
    # codex takes its state dir from CODEX_HOME, not from HOME.
    home-env: {CODEX_HOME: .codex}

  copilot:
    version: 1.0.107
    # no login-file: the default login is in the os keychain, and the
    # plaintext fallback hides in a config file that exists tokenless too.

  opencode:
    version: 1.19.5

harnesses:
  claude-cli-keyless:
    cli: claude
    # stream-json with partial messages gives events as they happen. plain
    # --print buffers to exit.
    run: >-
      claude --print --output-format stream-json --verbose --include-partial-messages
      ${PATS_EFFORT:+--effort "$PATS_EFFORT"} --model "$PATS_MODEL"
      --permission-mode bypassPermissions "$(cat "$PATS_PROMPT_FILE")"
    egress:
      allow:
        - .anthropic.com   # inference
        - .claude.com      # oauth token refresh, a 401 mid-run without it
    auth-env: [ANTHROPIC_API_KEY, ANTHROPIC_AUTH_TOKEN, CLAUDE_CODE_OAUTH_TOKEN]
    login: true
    pass-env: [ANTHROPIC_BASE_URL]
    auth-hint: >-
      a claude token env (CLAUDE_CODE_OAUTH_TOKEN) or ~/.claude/.credentials.json
      (or PATS_CLAUDE_AUTH_PATH)
    # tools are the tool_use blocks of each assistant turn. the totals come on
    # the result event, and a later result restates them.
    parse: |
      ev = json.decode(line, default = None)
      if type(ev) == "dict":
          t = ev.get("type")
          if t == "assistant":
              for c in ev.get("message", {}).get("content", []):
                  if c.get("type") == "tool_use":
                      out.tool(c.get("name", ""))
          elif t == "result":
              u = ev.get("usage", {})
              out.usage(
                  total = True,
                  turns = ev.get("num_turns", 0),
                  cost_usd = ev.get("total_cost_usd", 0),
                  input = u.get("input_tokens", 0),
                  output = u.get("output_tokens", 0),
                  cache_read = u.get("cache_read_input_tokens", 0),
                  cache_write = u.get("cache_creation_input_tokens", 0),
                  ttft_ms = ev.get("ttft_ms", 0),
                  api_ms = ev.get("duration_api_ms", 0),
              )
              out.error(ev.get("is_error", False))
              # every result is a candidate: a sub-agent's late note follows the answer.
              out.final(ev.get("result", ""), add = True)

  codex-cli-keyless:
    cli: codex
    # pats is the outer sandbox, so codex's own approvals and sandbox are off.
    # the prompt comes on stdin, so shell quoting never changes it.
    run: >-
      codex exec --json --ephemeral --ignore-user-config --skip-git-repo-check
      --dangerously-bypass-approvals-and-sandbox --model "$PATS_MODEL"
      ${PATS_EFFORT:+-c model_reasoning_effort="$PATS_EFFORT"} - < "$PATS_PROMPT_FILE"
    # api.github.com and raw.githubusercontent.com are left out on purpose:
    # an update probe and a banner, and the run works without them.
    egress:
      allow:
        - .openai.com    # oauth token refresh and api endpoints
        - .chatgpt.com   # chatgpt-account inference
    # no auth-env on purpose. codex reads CODEX_API_KEY and OPENAI_API_KEY
    # when set, and withholding them is what keeps this harness keyless.
    login: true
    auth-hint: ~/.codex/auth.json (file-based codex login, or PATS_CODEX_AUTH_PATH)
    # no turns: `codex exec` is one turn by construction. no cost_usd: a
    # chatgpt-account run has no price.
    parse: |
      TOOLS = ["command_execution", "file_change", "web_search"]

      ev = json.decode(line, default = None)
      if type(ev) == "dict":
          t = ev.get("type")
          if t == "item.completed":
              item = ev.get("item", {})
              kind = item.get("type")
              if kind in TOOLS:
                  out.tool(kind)
              elif kind == "mcp_tool_call":
                  server, tool = item.get("server", ""), item.get("tool", "")
                  out.tool("mcp:%s/%s" % (server, tool) if server and tool else kind)
              elif kind == "agent_message":
                  out.final(item.get("text", ""))
          elif t == "turn.completed":
              u = ev.get("usage", {})
              # cached tokens are a part of input here. the totals keep them apart.
              cached = u.get("cached_input_tokens", 0)
              out.usage(
                  input = u.get("input_tokens", 0) - cached,
                  cache_read = cached,
                  output = u.get("output_tokens", 0),
                  reasoning = u.get("reasoning_output_tokens", 0),
              )
          elif t in ("turn.failed", "error"):
              out.error()

  copilot-cli-keyless:
    cli: copilot
    # --disable-builtin-mcps drops the github mcp server, which would hand the
    # task github api access through the forwarded token.
    run: >-
      copilot -p "$(cat "$PATS_PROMPT_FILE")" --allow-all --output-format json
      --no-auto-update --no-remote-export --disable-builtin-mcps --model "$PATS_MODEL"
      ${PATS_EFFORT:+--effort "$PATS_EFFORT"}
    egress:
      allow:
        - .github.com          # auth and the copilot token exchange
        - .githubcopilot.com   # inference
    # only the copilot variable. GH_TOKEN and GITHUB_TOKEN are ambient in many
    # shells and usually lack the copilot permission.
    auth-env: [COPILOT_GITHUB_TOKEN]
    auth-hint: >-
      COPILOT_GITHUB_TOKEN (macos: security find-generic-password -s copilot-cli -w; or gh auth token)
    # the stream has no input or cache counts and no price: a run is billed in
    # premium requests.
    parse: |
      ev = json.decode(line, default = None)
      if type(ev) == "dict":
          t = ev.get("type")
          data = ev.get("data", {})
          if t == "tool.execution_start":
              out.tool(data.get("toolName", ""))
          elif t == "assistant.turn_end":
              out.usage(turns = 1)
          elif t == "assistant.message":
              out.usage(output = data.get("outputTokens", 0))
              text = data.get("content", "")
              if text.strip():
                  out.final(text)
          elif t == "result":
              u = ev.get("usage", {})
              out.usage(
                  total = True,
                  premium_requests = u.get("premiumRequests", 0),
                  api_ms = u.get("totalApiDurationMs", 0),
              )
              code = ev.get("exitCode")
              out.error(code != None and code != 0)

  opencode-openrouter:
    cli: opencode
    # the openrouter/ prefix is added here, so a config's model stays
    # e.g. openai/gpt-4o-mini.
    run: >-
      opencode run --model "openrouter/$PATS_MODEL" --dangerously-skip-permissions
      --format json --thinking ${PATS_EFFORT:+--variant "$PATS_EFFORT"}
      "$(cat "$PATS_PROMPT_FILE")"
    egress:
      allow:
        - openrouter.ai        # inference
        - models.dev           # model catalogue
        - models.opencode.ai   # model catalogue, newer releases
        - registry.npmjs.org   # runtime plugin fetch
    auth-env: [OPENROUTER_API_KEY]
    models: openrouter
    # usage is per step, so the totals add up over step_finish. the reply is
    # the text of the last step: a step that ended stays the reply until a
    # later one says something.
    parse: |
      ev = json.decode(line, default = None)
      if type(ev) == "dict":
          t = ev.get("type")
          part = ev.get("part", {})
          if t == "tool_use":
              out.tool(part.get("tool", ""))
          elif t == "step_start":
              out.clear()
          elif t == "text":
              out.text(part.get("text", ""))
          elif t == "step_finish":
              out.clear(next = True)
              tok = part.get("tokens", {})
              cache = tok.get("cache", {})
              # reasoning comes apart from output here. the totals count it in.
              reasoning = tok.get("reasoning", 0)
              out.usage(
                  turns = 1,
                  cost_usd = part.get("cost", 0),
                  input = tok.get("input", 0),
                  output = tok.get("output", 0) + reasoning,
                  reasoning = reasoning,
                  cache_read = cache.get("read", 0),
                  cache_write = cache.get("write", 0),
              )
          elif t == "error":
              out.error()
