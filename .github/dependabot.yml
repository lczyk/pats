# action and go module updates, one pull request a week each. a release
# must be a week old before it is proposed, so one pulled for being bad
# never gets here. the go toolchain itself is not covered: its version is
# named in the workflows, the snap and the proxy image, and moves by hand.
# dependabot reads this file from the default branch only.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      modules:
        patterns: ["*"]
    commit-message:
      prefix: chore
