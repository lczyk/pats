# action updates, one pull request a week. a release must be a week old
# before it is proposed, so one pulled for being bad never gets here.
# dependabot reads this file from the default branch only.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
