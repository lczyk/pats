# on a release tag: build and lint and test it, build the tarballs (make dist)
# and publish them as a github release, with notes generated from the pull
# requests since the previous tag. independent of the snap (snap.yml) and the
# images (publish_images.yml), which the same tag starts.
name: release

on:
  push:
    tags: [ "v*" ]

# one run per tag. a re-run finds the release it left and finishes it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # a tag that is not v$VERSION would ship binaries reporting another version.
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - name: Check the tag is the version
      run: |
        want="v$(cat VERSION)"
        if [ "$GITHUB_REF_NAME" != "$want" ]; then
          echo "tag $GITHUB_REF_NAME is not the version $want" >&2
          exit 1
        fi

  checks:
    needs: version
    uses: ./.github/workflows/checks.yml  # zizmor: ignore[self-repository] actionlint rejects $/

  dist:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@v7.1.0
      with:
        go-version: '1.26'
        cache: false

    - name: Build the tarballs
      run: make dist

    # a clean checkout at the tag, so no "dirty" and the tag's own version.
    - name: Check the version the binary reports
      run: |
        name="pats_${GITHUB_REF_NAME#v}_linux_amd64"
        tar -C "$RUNNER_TEMP" -xzf "dist/$name.tar.gz"
        got=$("$RUNNER_TEMP/$name/pats" --version)
        echo "$got"
        case "$got" in
          "${GITHUB_REF_NAME#v} @ "*dirty*) echo "built from a dirty tree" >&2; exit 1 ;;
          "${GITHUB_REF_NAME#v} @ "*) ;;
          *) echo "not version ${GITHUB_REF_NAME#v}" >&2; exit 1 ;;
        esac

    - uses: actions/upload-artifact@v7.0.2
      with:
        name: dist
        path: dist/
        if-no-files-found: error

  # a draft until every asset is up, so a failed upload never leaves a public
  # release half done. a pre-release iff the version has a suffix.
  release:
    needs: dist
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0

    - uses: actions/download-artifact@v8.0.2
      with:
        name: dist
        path: dist

    # github starts generated notes at the previous release, and most tags
    # have none, so start them at the previous tag.
    - name: Create the draft
      run: |
        if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
          echo "release $GITHUB_REF_NAME exists, uploading into it"
          exit 0
        fi
        args=(--draft --verify-tag --generate-notes)
        case "$GITHUB_REF_NAME" in *-*) args+=(--prerelease) ;; esac
        if prev=$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_REF_NAME^" 2>/dev/null); then
          args+=(--notes-start-tag "$prev")
        fi
        gh release create "$GITHUB_REF_NAME" "${args[@]}"

    - name: Upload the assets
      run: gh release upload "$GITHUB_REF_NAME" --clobber dist/*.tar.gz dist/checksums.txt

    - name: Publish
      run: gh release edit "$GITHUB_REF_NAME" --draft=false
