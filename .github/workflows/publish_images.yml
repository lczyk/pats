# on tag push: build the sandbox + egress-proxy images multiarch (amd64+arm64)
# and push them to ghcr. nothing runs under emulation: the proxy cross-compiles
# from the runner's own platform, and the sandbox builds natively on one runner
# per arch, its two digests joined into one multiarch tag. no signing; see
# spread-bread's push-ghcr.yaml for that.
#
# every run publishes <image>:<ref>, which is what a pats binary of that version
# pins to. a workflow_dispatch run publishes under the branch name, with / mapped
# to - (a docker tag can't hold a /). the rolling aliases (:latest, and
# sandbox:26.04) are only ever moved by the aliases job at the end -- see its
# comment, and docs/spec/fizz/publish.fizz for the model behind it.
name: publish_images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}/pats

jobs:
  # a dispatch from a branch publishes under the branch's name: one named like
  # a release or a rolling alias would overwrite what pats binaries pin.
  ref:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Refuse a reserved tag name
        if: github.ref_type == 'branch'
        run: |
          case "${GITHUB_REF_NAME//\//-}" in
              latest | 26.04 | v*)
                  echo "branch $GITHUB_REF_NAME would publish over a release or rolling tag" >&2
                  exit 1
                  ;;
          esac

  # the proxy protocol is coupled to the pats version, hence the version tag.
  egress-proxy:
    needs: ref
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
              docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build + push
        run: |
          docker buildx create --use
          docker buildx build --platform linux/amd64,linux/arm64 \
              --file images/Dockerfile.egress-proxy \
              --tag "$REGISTRY/egress-proxy:${GITHUB_REF_NAME//\//-}" \
              --push .

  # the default sandbox a config gets when it names no image. its cli set
  # floats at build time, so the version tag is what pins a run. each arch
  # builds on its own runner and pushes by digest only; sandbox-tags names them.
  sandbox:
    needs: ref
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
              docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # --provenance=false keeps the pushed digest a plain image manifest, so
      # sandbox-tags joins exactly two platform entries. an attestation
      # (provenance, sbom) makes it an index of image + attestation, and the
      # join then carries stray unknown/unknown entries or fails outright.
      - name: Build + push by digest
        run: |
          docker buildx create --use
          docker buildx build --platform "linux/${{ matrix.arch }}" \
              --provenance=false \
              --file images/Dockerfile.sandbox-26.04 \
              --output "type=image,name=$REGISTRY/sandbox,push-by-digest=true,name-canonical=true,push=true" \
              --metadata-file "$RUNNER_TEMP/meta.json" \
              .
          mkdir -p "$RUNNER_TEMP/digests"
          digest=$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/meta.json")
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sandbox-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  sandbox-tags:
    needs: sandbox
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sandbox-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
              docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Tag the multiarch image
        working-directory: ${{ runner.temp }}/digests
        run: |
          tag="$REGISTRY/sandbox:${GITHUB_REF_NAME//\//-}"
          refs=()
          for d in *; do refs+=("$REGISTRY/sandbox@sha256:$d"); done
          docker buildx imagetools create --tag "$tag" "${refs[@]}"
          docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}' |
              jq -e '[.manifests[].platform.architecture] | sort == ["amd64", "arm64"]'

  # moves the rolling aliases to the newest stable version (no pre-release
  # suffix) whose proxy and sandbox are both published. runs are serialised by
  # the concurrency group and each one re-reads git tags and the registry when
  # it starts, so concurrent releases always end with the aliases on the newest
  # one, never on whichever run happened to finish last. a waiting job may be
  # cancelled by a newer one queueing behind it; the newer one does the same
  # work against fresher state.
  aliases:
    if: github.ref_type == 'tag'
    needs: [egress-proxy, sandbox-tags]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: publish-aliases
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
              docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # only "not found" moves on to an older version: any other failure to
      # read a tag fails the job, or a registry hiccup would point the
      # aliases back at an older release.
      - name: Point the aliases at the newest published stable version
        run: |
          published() {
              if out=$(docker buildx imagetools inspect "$1" 2>&1); then
                  return 0
              fi
              if grep -qiE 'manifest unknown|: not found$' <<<"$out"; then
                  return 1
              fi
              echo "cannot read $1: $out" >&2
              exit 1
          }
          newest=""
          for t in $(git tag --list 'v*' | grep -v -e '-' | sort -V -r); do
              if published "$REGISTRY/egress-proxy:$t" && published "$REGISTRY/sandbox:$t"; then
                  newest="$t"
                  break
              fi
          done
          if [ -z "$newest" ]; then
              echo "no stable version has both images published yet; aliases unchanged"
              exit 0
          fi
          echo "newest published stable version: $newest (this run: $GITHUB_REF_NAME)"
          docker buildx imagetools create --tag "$REGISTRY/egress-proxy:latest" "$REGISTRY/egress-proxy:$newest"
          docker buildx imagetools create --tag "$REGISTRY/sandbox:latest" --tag "$REGISTRY/sandbox:26.04" "$REGISTRY/sandbox:$newest"
