name: snap

# pack the strict snap (docs/spec/snap.md) on each arch it ships for, then
# install it on the ubuntu releases a user runs and smoke-test it. a push to
# main releases it to edge, a release tag to beta. candidate and stable are
# released by hand.

on:
  push:
    branches: [ "main" ]
    # paths-ignore does not apply to a tag push.
    tags: [ "v*" ]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

# a superseded pull request run is cancelled; a push run is not, since its
# publish may have released one arch and not the other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - arch: amd64
            os: ubuntu-24.04
          - arch: arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner.os }}
    timeout-minutes: 45
    steps:
      # the full history, so the version stamp can tell a release tag from a
      # dev build.
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Build
        uses: snapcore/action-build@v1.3.0
        id: snapcraft
        with:
          snapcraft-args: pack --output pats_${{ matrix.runner.arch }}.snap

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: pats_${{ matrix.runner.arch }}.snap
          path: ${{ steps.snapcraft.outputs.snap }}
          if-no-files-found: error

  # spread's lxd suites (spread.yaml): the snap's own checks, and pairs through
  # it with the engines it drives, nested in an lxd container of each ubuntu.
  spread:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        runner:
          - arch: amd64
            os: ubuntu-24.04
          - arch: arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner.os }}
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # no cache in a workflow that publishes.
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26'
          cache: false

      - name: Download artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: pats_${{ matrix.runner.arch }}.snap
          path: .spread

      - name: Set up LXD
        uses: canonical/setup-lxd@v1

      # docker's FORWARD policy drops traffic on bridges it was not told
      # about, and the spread containers' way out is lxd's bridge.
      - name: Let lxd's bridge past docker
        run: |
          sudo iptables -I DOCKER-USER -i lxdbr0 -j ACCEPT
          sudo iptables -I DOCKER-USER -o lxdbr0 -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT

      - name: Install spread
        run: |
          go install github.com/canonical/spread/cmd/spread@v0.0.0-20260330203909-9fdce848027b
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Spread
        run: make spread 'SYSTEMS=lxd:' ARGS=-v

  # every snap, a dev build on edge too, pins the images of its VERSION
  # (src/sandbox/images.go), so none is released before they are in the
  # registry: a release commit reaches main before its tag, and its images come
  # only with the tag's publish_images. one job per channel at a time, across
  # runs and tags, releases both arches; it releases nothing once a newer
  # commit is on main (edge) or a newer release tag (beta), whose run releases
  # instead: github does not start runs in push order, and a re-run keeps its
  # run's commit.
  publish:
    needs: spread
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    concurrency:
      group: snap-publish-${{ startsWith(github.ref, 'refs/tags/v') && 'beta' || 'edge' }}
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # the snap is a release build only at the tag v$VERSION
      # (snap/snapcraft.yaml); any other tag would be a dev build on beta.
      - name: Check the tag is the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          want="v$(cat VERSION)"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "tag $GITHUB_REF_NAME is not the version $want" >&2
            exit 1
          fi

      - name: Wait for the images
        timeout-minutes: 75
        env:
          REGISTRY: ghcr.io/${{ github.repository_owner }}/pats
        run: |
          v="v$(cat VERSION)"
          for image in sandbox egress-proxy; do
            until docker manifest inspect "$REGISTRY/$image:$v" > /dev/null 2>&1; do
              echo "waiting for $REGISTRY/$image:$v"
              sleep 60
            done
          done

      - name: Download artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: pats_*.snap
          merge-multiple: true

      # after the wait, right before the release: a newer push may have come
      # in the meantime. a newer release tag is one on a descendant of this
      # commit, which needs no version ordering.
      - name: Check this run is the newest
        id: fresh
        run: |
          git fetch --quiet --force --tags origin main
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            newer=$(git tag --list 'v*' --contains "$GITHUB_SHA" | grep -vxF "$GITHUB_REF_NAME" || true)
          else
            # the newest commit that starts a run, on main and in this run:
            # paths-ignore above leaves out one that only touches markdown,
            # and a push that ends in one still runs, at that commit.
            tip=$(git log -1 --format=%H FETCH_HEAD -- . ':(glob,exclude)**/*.md')
            mine=$(git log -1 --format=%H "$GITHUB_SHA" -- . ':(glob,exclude)**/*.md')
            newer=$([ "$tip" = "$mine" ] || echo "main at $tip")
          fi
          if [ -n "$newer" ]; then
            echo "not released, a newer one is out: $newer"
            echo "newest=false" >> "$GITHUB_OUTPUT"
          else
            echo "newest=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Release amd64
        if: steps.fresh.outputs.newest == 'true'
        uses: snapcore/action-publish@v1.2.0
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: pats_amd64.snap
          release: ${{ startsWith(github.ref, 'refs/tags/v') && 'beta' || 'edge' }}

      - name: Release arm64
        if: steps.fresh.outputs.newest == 'true'
        uses: snapcore/action-publish@v1.2.0
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: pats_arm64.snap
          release: ${{ startsWith(github.ref, 'refs/tags/v') && 'beta' || 'edge' }}
