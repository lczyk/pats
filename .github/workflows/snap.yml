name: snap

# pack the strict snap (docs/spec/snap.md) on each arch it ships for, then
# install it on the ubuntu releases a user runs and smoke-test it. nothing is
# published yet.

on:
  push:
    branches: [ "main", "1.x" ]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [ "main", "1.x" ]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - arch: amd64
            os: ubuntu-24.04
          - arch: arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner.os }}
    timeout-minutes: 45
    steps:
      # the full history, so the version stamp can tell a release tag from a
      # dev build.
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Build
        uses: snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79 # v1.3.0
        id: snapcraft
        with:
          snapcraft-args: pack --output pats_${{ matrix.runner.arch }}.snap

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pats_${{ matrix.runner.arch }}.snap
          path: ${{ steps.snapcraft.outputs.snap }}
          if-no-files-found: error

  smoke-test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        runner:
          - arch: amd64
            os: ubuntu-24.04
          - arch: amd64
            os: ubuntu-22.04
          - arch: arm64
            os: ubuntu-24.04-arm
          - arch: arm64
            os: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Download artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pats_${{ matrix.runner.arch }}.snap

      - name: Install snap
        run: sudo snap install --dangerous pats_${{ matrix.runner.arch }}.snap

      - name: Smoke test
        run: hack/snap_smoke.sh
        env:
          PATS: /snap/bin/pats
