name: snap

# pack the strict snap (docs/spec/snap.md) on each arch it ships for, then
# install it on the ubuntu releases a user runs and smoke-test it. a push to
# 1.x releases it to edge, a release tag to beta. candidate and stable are
# released by hand.

on:
  push:
    branches: [ "main", "1.x" ]
    # paths-ignore does not apply to a tag push.
    tags: [ "v*" ]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [ "main", "1.x" ]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

# a superseded pull request run is cancelled; a push run is not, since its
# publish may have released one arch and not the other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - arch: amd64
            os: ubuntu-24.04
          - arch: arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner.os }}
    timeout-minutes: 45
    steps:
      # the full history, so the version stamp can tell a release tag from a
      # dev build.
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Build
        uses: snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79 # v1.3.0
        id: snapcraft
        with:
          snapcraft-args: pack --output pats_${{ matrix.runner.arch }}.snap

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pats_${{ matrix.runner.arch }}.snap
          path: ${{ steps.snapcraft.outputs.snap }}
          if-no-files-found: error

  smoke-test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        runner:
          - arch: amd64
            os: ubuntu-24.04
          - arch: amd64
            os: ubuntu-22.04
          - arch: arm64
            os: ubuntu-24.04-arm
          - arch: arm64
            os: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Download artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pats_${{ matrix.runner.arch }}.snap

      - name: Install snap
        run: sudo snap install --dangerous pats_${{ matrix.runner.arch }}.snap

      - name: Smoke test
        run: hack/snap_smoke.sh
        env:
          PATS: /snap/bin/pats

  # a pair of hack/snap-smoke run and scored through the installed snap, its
  # steps in a step sandbox of each engine. the agent sandbox is docker in
  # both, so the docker plug is always connected.
  pair:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        runner:
          - arch: amd64
            os: ubuntu-24.04
          - arch: arm64
            os: ubuntu-24.04-arm
        engine: [docker, lxd]
    runs-on: ${{ matrix.runner.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Download artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pats_${{ matrix.runner.arch }}.snap

      - name: Set up LXD
        if: matrix.engine == 'lxd'
        uses: canonical/setup-lxd@8c6a87bfb56aa48f3fb9b830baa18562d8bfd4ee # v1

      # docker's FORWARD policy drops traffic on bridges it was not told
      # about, as in lint_and_test's lxd-e2e.
      - name: Let pats's bridges past docker
        if: matrix.engine == 'lxd'
        run: |
          for br in patsbr+ patsup; do
            sudo iptables -I DOCKER-USER -i "$br" -j ACCEPT
            sudo iptables -I DOCKER-USER -o "$br" -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT
          done

      - name: Install snap
        run: |
          sudo snap install --dangerous pats_${{ matrix.runner.arch }}.snap
          sudo snap connect pats:docker
          if [ "${{ matrix.engine }}" = lxd ]; then
            sudo snap connect pats:lxd lxd:lxd
          fi

      - name: Smoke test
        run: hack/snap_smoke.sh ${{ matrix.engine }}
        env:
          PATS: /snap/bin/pats

  # every snap, a dev build on edge too, pins the images of its VERSION
  # (src/sandbox/images.go), so none is released before they are in the
  # registry: a release commit reaches 1.x before its tag, and its images come
  # only with the tag's publish_images. re-run only the latest run: an older
  # one releases an older snap, and queued it replaces the newest waiting run.
  publish:
    needs: [smoke-test, pair]
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/1.x' || startsWith(github.ref, 'refs/tags/v'))
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # the snap is a release build only at the tag v$VERSION
      # (snap/snapcraft.yaml); any other tag would be a dev build on beta.
      - name: Check the tag is the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          want="v$(cat VERSION)"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "tag $GITHUB_REF_NAME is not the version $want" >&2
            exit 1
          fi

      - name: Wait for the images
        timeout-minutes: 75
        env:
          REGISTRY: ghcr.io/${{ github.repository_owner }}/pats
        run: |
          v="v$(cat VERSION)"
          for image in sandbox egress-proxy; do
            until docker manifest inspect "$REGISTRY/$image:$v" > /dev/null 2>&1; do
              echo "waiting for $REGISTRY/$image:$v"
              sleep 60
            done
          done

      - name: Download artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pats_${{ matrix.arch }}.snap

      - name: Release
        uses: snapcore/action-publish@214b86e5ca036ead1668c79afb81e550e6c54d40 # v1.2.0
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: pats_${{ matrix.arch }}.snap
          release: ${{ startsWith(github.ref, 'refs/tags/v') && 'beta' || 'edge' }}
