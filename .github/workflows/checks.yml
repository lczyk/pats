name: checks

# build, lint and test, the native build and the strict snap's reduced one
# (docs/spec/build-tags.md). called by lint_and_test on every change and by
# release before it builds anything.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@v7.1.0
      with:
        go-version: '1.26'

    - name: Build
      run: make build

    - name: Lint
      run: make lint

    - name: Test
      run: make test

  # the drivers the strict snap leaves out must stay out cleanly, tests included.
  tagged:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@v7.1.0
      with:
        go-version: '1.26'

    - name: Vet
      run: go vet -tags nohost,nobwrap,nopodman ./...

    - name: Test
      run: go test -race -tags nohost,nobwrap,nopodman ./...
