name: lint_and_test

on:
  push:
    branches: [ "main", "1.x" ]
  pull_request:
    branches: [ "main", "1.x" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.26'

    - name: Build
      run: make build

    - name: Lint
      run: make lint

    - name: Test
      run: make test

  # the workflows themselves only run on a push or a tag, so lint them here.
  actionlint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Lint workflows
      run: docker run --rm -v "$PWD":/repo -w /repo rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9
