name: lint_and_test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@v7.0.0
      with:
        go-version: '1.26'

    - name: Build
      run: make build

    - name: Lint
      run: make lint

    - name: Test
      run: make test

  # the reduced build the strict snap ships (docs/spec/build-tags.md): the
  # drivers it leaves out must stay out cleanly, tests included.
  tagged:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@v7.0.0
      with:
        go-version: '1.26'

    - name: Vet
      run: go vet -tags nohost,nobwrap,nopodman ./...

    - name: Test
      run: go test -race -tags nohost,nobwrap,nopodman ./...

  # the lxd driver end to end on the runner's own lxd. the runner also runs
  # docker, whose FORWARD policy drops traffic on bridges it was not told
  # about, so pats's bridges are let through first -- the same rule an admin
  # adds on any lxd server that runs docker.
  # the current lts and the next major: the rest api is additive, but the
  # behaviours the driver works around may not be.
  lxd-e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lxd: ['5.21/stable', '6/stable']
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@v7.0.0
      with:
        go-version: '1.26'

    - name: Set up LXD
      uses: canonical/setup-lxd@v1
      with:
        channel: ${{ matrix.lxd }}

    - name: Let pats's bridges past docker
      run: |
        for br in patsbr+ patsup; do
          sudo iptables -I DOCKER-USER -i "$br" -j ACCEPT
          sudo iptables -I DOCKER-USER -o "$br" -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT
        done

    # setup-lxd hands the socket to the adm group, which the runner user is
    # already in: no sg, which wants a password in a non-interactive shell.
    - name: LXD e2e
      run: PATS_LXD_E2E=1 go test ./src/sandbox/ -run 'TestLXDE2E|TestLXDContract$' -v -timeout 30m

  # the bwrap driver end to end: 26.04's bubblewrap is 0.11, with --overlay,
  # and its apparmor profile lets an unprivileged user make namespaces.
  bwrap-e2e:
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@v7.0.0
      with:
        go-version: '1.26'

    - name: Install bubblewrap
      run: sudo apt-get update && sudo apt-get install -y bubblewrap

    - name: bwrap e2e
      run: PATS_BWRAP_E2E=1 go test ./src/sandbox/ -run 'TestBwrapE2E|TestBwrapStartPreflight' -v -timeout 30m

  # a pats that is not the snap against the docker snap, whose cli opens no
  # file under /tmp or a hidden dir of the home (docs/spec/docker-snap-paths.md).
  # the runner's own docker is stopped so the snap's daemon has the socket,
  # and /snap/bin goes first on PATH so `docker` is the snap's cli.
  docker-snap:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@v7.0.0
      with:
        go-version: '1.26'

    - name: Swap the runner's docker for the docker snap
      run: |
        sudo systemctl stop docker.socket docker.service
        sudo snap install docker
        echo /snap/bin >> "$GITHUB_PATH"

    # a docker test skips when there is no daemon: without this check the
    # job would pass having tested nothing.
    - name: Check docker is the snap's
      run: |
        [ "$(command -v docker)" = /snap/bin/docker ]
        for _ in $(seq 30); do docker info > /dev/null 2>&1 && break; sleep 2; done
        docker info

    - name: Build
      run: make build

    # the tests bind and build from t.TempDir(), which the docker snap sees
    # only under the home.
    - name: Test
      run: |
        mkdir -p "$HOME/pats-tmp"
        TMPDIR="$HOME/pats-tmp" make test

    - name: Docker pair
      run: hack/snap_smoke.sh docker
      env:
        PATS: ${{ github.workspace }}/bin/pats
        PAIR_ONLY: "1"

  # the spread system tests (spread.yaml): pats from this tree in bread
  # containers on the runner's docker, per native arch.
  spread:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@v7.0.0
      with:
        go-version: '1.26'

    - name: Install spread
      run: |
        go install github.com/canonical/spread/cmd/spread@v0.0.0-20260330203909-9fdce848027b
        echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

    - name: Spread
      run: make spread ARGS=-v

  # the workflows themselves only run on a push or a tag, so lint them here.
  actionlint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - name: Lint workflows
      run: docker run --rm -v "$PWD":/repo -w /repo rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9

  # the security lint of the workflows: token scopes, injection through
  # templates, credentials left behind, actions the lockfile does not cover.
  zizmor:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - name: Audit workflows
      run: docker run --rm -e GH_TOKEN -v "$PWD":/repo -w /repo ghcr.io/zizmorcore/zizmor:1.32.0@sha256:3014cc8f68f663935f69b3c3e0e41f5ce102b268d97db13db0f62208747f860d .

  # every action the workflows use is pinned to a commit in
  # .github/workflows/actions.lock. this fails when the lockfile is out of
  # step with the workflows (re-run `make actions-lock`) or a pin no longer
  # verifies upstream.
  lockfile:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@v7.0.0
      with:
        go-version: '1.26'

    - name: Verify the lockfile
      run: make actions-lock ARGS=--verify
