# the spread pairs' project (../pair.sh): one pair with a stub
# agent, its steps and scorer in a docker step sandbox (suite docker) or an
# lxd one behind an egress policy (suite lxd). the placed sandboxes are only
# made, never run: each takes a harness cli pats fetches and places.
sandbox:
  kind: sandbox
  items:
    agent:
      driver: docker
      build: agentimg
    steps-docker:
      driver: docker
      image: docker.io/library/ubuntu:24.04
    steps-lxd:
      driver: lxd
      image: ubuntu:24.04
      egress:
        allow:
          - .ubuntu.com
    placed-docker:
      driver: docker
      base: docker.io/library/ubuntu:24.04
    placed-lxd:
      driver: lxd
      base: ubuntu:24.04

agents:
  kind: agent
  items:
    stub:
      harness: opencode-openrouter
      model: anthropic/claude-haiku-4.5
      sandbox: agent
    placed-docker:
      harness: pi-openrouter
      model: anthropic/claude-haiku-4.5
      sandbox: placed-docker
    placed-lxd:
      harness: pi-openrouter
      model: anthropic/claude-haiku-4.5
      sandbox: placed-lxd

tasks:
  kind: task
  items:
    t-docker:
      prompt: say hi
      step-sandbox: steps-docker
      stage: helper > "$PATS_WORKDIR/staged"; id -u > "$PATS_OUTPUT_DIR/stage-uid"; echo "home=$HOME"
      collect: cp "$PATS_WORKDIR/staged" "$PATS_OUTPUT_DIR/collected"
    t-lxd:
      prompt: say hi
      step-sandbox: steps-lxd
      stage: helper > "$PATS_WORKDIR/staged"; id -u > "$PATS_OUTPUT_DIR/stage-uid"; echo "home=$HOME"
      collect: cp "$PATS_WORKDIR/staged" "$PATS_OUTPUT_DIR/collected"

scorers:
  kind: scorer
  items:
    s-docker:
      step-sandbox: steps-docker
      score: test -d "$PATS_SCORED_DIR" && echo 1
    s-lxd:
      step-sandbox: steps-lxd
      score: test -d "$PATS_SCORED_DIR" && echo 1

suites:
  kind: suite
  items:
    docker:
      agents: stub
      tasks: t-docker
      scorers: s-docker
    lxd:
      agents: stub
      tasks: t-lxd
      scorers: s-lxd
    # never run: its agents are here so their sandboxes can be made.
    placed:
      agents: [placed-docker, placed-lxd]
      tasks: t-docker
      manual: true
